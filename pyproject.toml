[project]
name = "PROJECT_TEMPLATE"
version = "0.1.0"
description = "DESCRIPTION"
license = "CC0-1.0"
authors = [{ name = "c.winger" }]
readme = "README.md"
urls = { "Repository" = "https://github.com/wingechr/PROJECT_TEMPLATE" }

requires-python = ">=3.10"
dependencies = [
  "wingechr-assets @ file:///${PROJECT_ROOT}/assets",
  "wingechr-docs @ file:///${PROJECT_ROOT}/docs",
  "wingechr-python-package @ file:///${PROJECT_ROOT}/python_package",
  "wingechr-python-server @ file:///${PROJECT_ROOT}/python_server",
  "bumpversion~=0.6",
  "djlint~=1.36",
  "ipykernel~=6.31",
  "poethepoet~=0.38",
  "pre-commit~=4.5",
  "pytest~=9.0",
  "tox~=4.32",
  "twine~=6.2",
  "vulture~=2.14",
  "ruff>=0.14.9",
]

[dependency-groups]
dev = [
  "bandit>=1.9.2",
  "black>=25.12.0",
  "flake8>=7.3.0",
  "flake8-bandit>=4.1.1",
  "flake8-black>=0.4.0",
  "flake8-bugbear>=25.11.29",
  "flake8-builtins>=3.1.0",
  "flake8-comprehensions>=3.17.0",
  "flake8-docstrings>=1.7.0",
  "flake8-eradicate>=1.5.0",
  "flake8-isort>=7.0.0",
  "isort>=7.0.0",
]


[tool.ruff]
line-length = 88
exclude = ["**/migrations/*.py"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear: opinionated bug & design warnings
  "B",
  # flake8-simplify
  "SIM",
  # isort: imports
  "I",
  # flake8-bandit: Security issues
  "S",
  # flake8-builtins
  "A",
  # flake8-comprehensions
  "C4",
  # pydocstyle
  "D",
]
ignore = [
  "B023",
  "B017",
  "D101",
  "D103",
  "D105",
  "D202",
  "D400",
  "D415",
  "D211",
  "D213",
  "D203",
  "E20",
  "E203",
  "E402",
  "I001",
  #"I005",
  "S101",
  "S310",
  "S603",
  "S608",
  #"W503",
]


[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
